<!DOCTYPE html>
<html lang="pt-BR" data-theme="violet" data-appearance="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha · Capital Novo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["DM Sans", "system-ui", "sans-serif"] },
            colors: {
              bank: {
                bg: "#0c0c14",
                card: "#14141f",
                border: "rgba(255,255,255,0.08)",
                muted: "#9ca3af",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(124, 58, 237, 0.22), transparent),
          #0c0c14;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
  </head>
  <body class="min-h-screen text-zinc-100 antialiased">
    <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-10">
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-semibold text-white">Nova senha</h1>
        <p class="mt-2 text-sm text-bank-muted">Escolha uma nova senha para sua conta</p>
      </div>

      <div class="rounded-2xl border border-bank-border bg-bank-card p-6 shadow-xl">
        <p id="reset-erro" class="mb-4 hidden rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200"></p>
        <p id="reset-ok" class="mb-4 hidden rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-200"></p>
        <p id="reset-aguarde" class="mb-4 text-center text-sm text-bank-muted">Validando link…</p>

        <form id="form-nova-senha" class="hidden space-y-4">
          <div>
            <label for="nova-senha" class="block text-xs font-medium text-zinc-400">Nova senha (mín. 6)</label>
            <input
              id="nova-senha"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
              class="mt-1.5 w-full rounded-xl border border-bank-border bg-[#0c0c14] px-4 py-2.5 text-sm text-white outline-none ring-violet-500/40 focus:border-violet-500/50 focus:ring-2"
            />
          </div>
          <div>
            <label for="nova-senha-confirma" class="block text-xs font-medium text-zinc-400">Confirmar nova senha</label>
            <input
              id="nova-senha-confirma"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
              class="mt-1.5 w-full rounded-xl border border-bank-border bg-[#0c0c14] px-4 py-2.5 text-sm text-white outline-none ring-violet-500/40 focus:border-violet-500/50 focus:ring-2"
            />
          </div>
          <button
            type="submit"
            id="btn-salvar-senha"
            class="w-full rounded-xl bg-violet-600 py-2.5 text-sm font-semibold text-white transition hover:bg-violet-500 disabled:opacity-60"
          >
            Salvar e entrar
          </button>
        </form>

        <p id="reset-link-invalido" class="hidden text-center text-sm leading-relaxed text-bank-muted">
          <span id="reset-link-invalido-msg">Link inválido ou expirado.</span>
          <a href="index.html" class="mt-3 block text-violet-400 hover:text-violet-300">Voltar ao login · solicitar novo link</a>
        </p>
      </div>

      <p class="mt-6 text-center text-xs text-zinc-600">
        <a href="index.html" class="text-zinc-500 hover:text-zinc-400">← Voltar ao login</a>
      </p>
    </main>

    <script>
      (function () {
        var erroEl = document.getElementById("reset-erro");
        var okEl = document.getElementById("reset-ok");
        var aguardeEl = document.getElementById("reset-aguarde");
        var formEl = document.getElementById("form-nova-senha");
        var invalidoEl = document.getElementById("reset-link-invalido");
        var recoveryReady = false;

        function showErro(msg) {
          erroEl.textContent = msg;
          erroEl.classList.remove("hidden");
          okEl.classList.add("hidden");
        }

        function showInvalido(msg) {
          aguardeEl.classList.add("hidden");
          formEl.classList.add("hidden");
          if (msg) {
            document.getElementById("reset-link-invalido-msg").textContent = msg;
          }
          invalidoEl.classList.remove("hidden");
        }

        function showForm() {
          aguardeEl.classList.add("hidden");
          invalidoEl.classList.add("hidden");
          formEl.classList.remove("hidden");
          recoveryReady = true;
        }

        function hashParams() {
          var hash = (window.location.hash || "").replace(/^#/, "");
          return hash ? new URLSearchParams(hash) : new URLSearchParams();
        }

        function hashErrorMessage(params) {
          if (params.get("error_code") === "otp_expired") {
            return "Este link expirou. Volte ao login e clique em «Esqueci minha senha» para receber outro.";
          }
          if (params.get("error")) {
            return "Link inválido ou já usado. Volte ao login e solicite um novo em «Esqueci minha senha».";
          }
          return null;
        }

        var params = hashParams();
        var hashErr = hashErrorMessage(params);
        if (hashErr) {
          showInvalido(hashErr);
          return;
        }

        if (
          !window.GFP_SUPABASE_URL ||
          !window.GFP_SUPABASE_ANON_KEY ||
          window.GFP_SUPABASE_URL.indexOf("SEU_PROJETO") !== -1
        ) {
          showInvalido("Configuração do site incompleta.");
          return;
        }

        var sb = window.supabase.createClient(window.GFP_SUPABASE_URL, window.GFP_SUPABASE_ANON_KEY, {
          auth: {
            detectSessionInUrl: true,
            persistSession: true,
          },
        });

        async function tryActivateRecovery() {
          var accessToken = params.get("access_token");
          var refreshToken = params.get("refresh_token");
          if (accessToken && refreshToken) {
            var setRes = await sb.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken,
            });
            if (!setRes.error && setRes.data.session) {
              showForm();
              return true;
            }
          }
          var sessionRes = await sb.auth.getSession();
          if (sessionRes.data && sessionRes.data.session) {
            showForm();
            return true;
          }
          return false;
        }

        sb.auth.onAuthStateChange(function (event) {
          if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") {
            showForm();
          }
        });

        tryActivateRecovery().then(function (ok) {
          if (ok) return;
          if (params.get("access_token") || params.get("type") === "recovery") {
            showInvalido("Não foi possível validar o link. Solicite um novo em «Esqueci minha senha».");
            return;
          }
          showInvalido(
            "Abra o link que enviamos por e-mail (não digite o endereço manualmente). Se expirou, solicite outro em «Esqueci minha senha»."
          );
        });

        document.getElementById("form-nova-senha").addEventListener("submit", async function (e) {
          e.preventDefault();
          if (!recoveryReady) {
            showErro("Link inválido. Solicite um novo e-mail de redefinição.");
            return;
          }
          var senha = document.getElementById("nova-senha").value;
          var confirma = document.getElementById("nova-senha-confirma").value;
          if (senha !== confirma) {
            showErro("As senhas não coincidem.");
            return;
          }
          var btn = document.getElementById("btn-salvar-senha");
          btn.disabled = true;
          erroEl.classList.add("hidden");
          var result = await sb.auth.updateUser({ password: senha });
          btn.disabled = false;
          if (result.error) {
            showErro(result.error.message || "Não foi possível salvar a senha.");
            return;
          }
          okEl.textContent = "Senha atualizada! Redirecionando…";
          okEl.classList.remove("hidden");
          setTimeout(function () {
            window.location.replace("dashboard.html");
          }, 1200);
        });
      })();
    </script>
  </body>
</html>
